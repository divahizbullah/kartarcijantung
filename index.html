<style>
:root{--bg:#f4f5f7;--c:#fff;--t:#1b1f27;--m:#667085;--p:#c62828;--b:#e3e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pr{background:var(--p);border-color:var(--p);color:#fff}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);margin:2px 0 10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
.m{color:var(--m)}h2{margin:0;font-size:20px}h3{margin:0 0 8px;font-size:16px}
#lg{max-width:380px;margin:8vh auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--p);color:#fff}
.top b{font-size:16px}.top button{background:transparent;color:#fff;border-color:#ffffff88}

#main{max-width:1000px;margin:0 auto;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.st b{font-size:24px;display:block}.st{margin:0}
.sc{overflow-x:auto;padding:4px 8px}table{border-collapse:collapse;width:100%;font-size:14px}

.ac{white-space:nowrap;text-align:right}.ac button{margin-left:4px;padding:3px 9px;font-size:13px}

.ok{color:#2e7d32;font-weight:600}.no{color:var(--p)}

#lw{position:fixed;inset:0;background:#555;overflow:auto;display:none;z-index:20;padding:12px}
.tb{width:210mm;max-width:100%;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}

.kop h1{margin:0;font-size:18pt}.kop small{font-size:10pt}
.lg{width:64px;height:64px;border:2px solid #000;border-radius:50%;display:grid;place-items:center;font-weight:700}
.dbl{border:0;border-top:3px double #000;margin:8px 0 16px}
.mt td{border:0;padding:0 8px 0 0}.r{text-align:right}.pre{white-space:pre-line}
.ttd{display:flex;justify-content:space-between;margin-top:30px;text-align:center}

.kop img{position:absolute;top:0;height:84px}.kop .l{left:0}.kop .r2{right:0}
.k1{font:700 30pt/1.1 "Times New Roman",serif}.k2{font:700 16pt/1.3 "Times New Roman",serif;color:#1976c2}.k3{font:700 10.5pt/1.3 "Times New Roman",serif}.k4{font:700 9pt/1.3 "Times New Roman",serif}

.pre2{white-space:pre-line}h3.sec{margin:18px 0 8px}details.card summary{cursor:pointer}

function fix(){RW=Object.keys(S.units).sort();const w='KECAMATAN PASAR REBO, KOTA ADMINISTRASI JAKARTA TIMUR\nPROVINSI DAERAH KHUSUS IBUKOTA JAKARTA';if(!S.kel)S.kel={nama:'PENGURUS KELURAHAN CIJANTUNG',sekretariat:'Alamat: Gg. Kramat I No.2, RT.3/RW.3, Cijantung, Kec. Ps. Rebo, Kota Jakarta Timur, Daerah Khusus Ibukota Jakarta 13770',email:'karunacijantung@gmail.com'};[S.kel,...RW.map(r=>S.units[r])].forEach(u=>{u.nama=u.nama.replace(/^Karang Taruna /i,'');if(u.wilayah==null)u.wilayah=w;if(u.email==null)u.email='';if(u.status==null)u.status='Aktif'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function resetData(){S=seed();fix();save();fillU();toast('Data contoh dipulihkan')}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}

const SC={
members:{t:'Anggota Karang Taruna Kelurahan',f:[['nama','Nama lengkap'],['nik','NIK'],['tempat','Tempat lahir'],['lahir','Tanggal lahir','date'],['jk','Jenis kelamin','sel',['Laki-laki','Perempuan']],['pend','Pendidikan terakhir','sel',['SD','SMP','SMA/SMK','D3','S1','S2']],['kerja','Pekerjaan'],['hp','No. HP'],['email','Email','opte'],['rt','RT'],['rw','RW','sel',RW],['alamat','Alamat lengkap','area'],['jabatan','Jabatan','sel',['Ketua','Wakil Ketua','Sekretaris','Bendahara','Seksi','Anggota']],['gabung','Tanggal bergabung','date'],['status','Status','sel',['Aktif','Tidak aktif']]],c:['nama','nik','rw','jabatan','hp','status','ttd']},
events:{t:'Event',f:[['judul','Nama event'],['tanggal','Tanggal','date'],['lokasi','Lokasi'],['ket','Keterangan / isi berita','area'],['ig','Link postingan Instagram (opsional)','opt'],['foto','Foto kegiatan','img']],c:['judul','tanggal','lokasi','ket']},
rapat:{t:'Rapat dan Kehadiran',f:[['judul','Agenda rapat'],['tanggal','Tanggal','date'],['notulen','Notulensi rapat','area'],['hadir','Daftar hadir','checks']],c:['judul','tanggal','hadir']},
umem:{t:'Anggota Unit',f:[['nama','Nama lengkap'],['nik','NIK'],['tempat','Tempat lahir'],['lahir','Tanggal lahir','date'],['jk','Jenis kelamin','sel',['Laki-laki','Perempuan']],['pend','Pendidikan terakhir','sel',['SD','SMP','SMA/SMK','D3','S1','S2']],['kerja','Pekerjaan'],['hp','No. HP'],['email','Email','opte'],['rt','RT'],['alamat','Alamat lengkap','area'],['jabatan','Jabatan','sel',['Ketua Unit','Wakil Ketua','Sekretaris','Bendahara','Seksi','Anggota']],['gabung','Tanggal bergabung','date'],['status','Status','sel',['Aktif','Tidak aktif']]],c:['nama','nik','jabatan','hp','status'],unit:1},
stim:{t:'Laporan Stimulan',f:[['bulan','Bulan','sel',BLN],['tahun','Tahun','number'],['kegiatan','Nama kegiatan (pilih dari event atau ketik)','dl',()=>S.events.map(e=>e.judul)],['bidang','Divisi / bidang kegiatan','dl',['Organisasi dan Kelembagaan','Pendidikan dan Pelatihan','Kewirausahaan','Olahraga dan Seni Budaya','Kesejahteraan Sosial','Lingkungan Hidup']]],c:['bulan','tahun','kegiatan','bidang'],unit:1,print:1}};
const NAV={pengurus:[['dash','Dashboard'],['members','Keanggotaan'],['events','Event'],['rapat','Rapat'],['stim','Laporan Stimulan'],['set','Kop Surat']],
anggota:[['dash','Dashboard'],['events','Event'],['hadir','Kehadiran Rapat'],['profil','Profil']],
unit:[['dash','Dashboard'],['umem','Keanggotaan'],['stim','Laporan Stimulan'],['set','Kop Surat']]};

function fillU(){const r=$('#role').value;$('#uw').style.display=r=='pengurus'?'none':'block';
if(r=='anggota'){$('#ul').textContent='Nama anggota';$('#usr').innerHTML=S.members.map(m=>`<option value="${m.id}">${E(m.nama)} (RW ${m.rw})</option>`).join('')}
if(r=='unit'){$('#ul').textContent='Unit RW';$('#usr').innerHTML=RW.filter(x=>S.units[x].status!='Tidak aktif').map(x=>`<option value="${x}">Unit RW ${x}</option>`).join('')}
$('#hint').textContent='Contoh sandi: '+PW[r]}
function doLogin(){const r=$('#role').value;if($('#pw').value!=PW[r])return toast('Kata sandi salah');
U={role:r};if(r=='anggota'){U.id=+$('#usr').value;U.nama=(S.members.find(m=>m.id==U.id)||{}).nama}if(r=='unit')U.rw=$('#usr').value;
$('#lg').style.display='none';$('#app').style.display='block';
$('#who').textContent=r=='pengurus'?'Pengurus Kelurahan':r=='anggota'?U.nama:'Unit RW '+U.rw;go('dash')}
function logout(){U=null;$('#app').style.display='none';$('#lg').style.display='block';$('#pw').value='';fillU()}
function go(v){view=v;$('#nav').innerHTML=NAV[U.role].map(([k,l])=>`<button class="${k==v||(k=='members'&&(v=='units'||v=='umem'))?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+(U.role!='anggota'?`<a class="ext" href="https://karangtaruna.jakarta.go.id/" target="_blank" rel="noopener noreferrer">Web Karang Taruna ↗</a>`:'');
const m={dash,units:vUnits,hadir:vHadir,set:vSet,profil:vProfil};$('#main').innerHTML=(U.role=='pengurus'&&['members','units','umem'].includes(v)?sub(v):'')+(m[v]||(()=>crud(v)))()}

const sub=v=>`<div class="sub">${[['members','Anggota'],['units','Unit RW'],['umem','Anggota Unit']].map(([k,l])=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`;
function det(k,id){const s=SC[k],r=S[k].find(x=>x.id==id),fm=$('#dlg form');fm.className='one';fm.onsubmit=null;fm.innerHTML=`<h3>Biodata ${E(r.nama)}</h3><table>${s.f.map(([n,l,t])=>`<tr><th>${l}</th><td>${t=='date'?D(r[n]):E(r[n])||'-'}</td></tr>`).join('')}</table><div class="ac"><button type="button" onclick="$('#dlg').close()">Tutup</button></div>`;$('#dlg').showModal()}
function crud(k){const s=SC[k],ro=U.role=='anggota'||(k=='umem'&&U.role=='pengurus'),un=s.unit;let rows=S[k];if(un&&U.role=='unit')rows=rows.filter(r=>r.rw==U.rw);
if(k=='events'||k=='rapat')rows=[...rows].sort((a,b)=>a.tanggal<b.tanggal?1:-1);
const cols=un&&U.role!='unit'?['rw',...s.c]:s.c;const lab=c=>c=='rw'?'RW':c=='ttd'?'Tanda tangan':((s.f.find(f=>f[0]==c)||[])[1]||c);
const cell=(r,c)=>c=='tanggal'?D(r[c]):c=='jumlah'?R(r[c]):c=='hadir'?r[c].length+' hadir':c=='ttd'?(r.ttd?'✓ ada':'belum'):c=='rw'?(r[c]=='Kelurahan'?'Kelurahan':'RW '+r[c]):E(r[c]);
return `<div class="hd"><h2>${s.t}${k=='umem'&&U.role=='pengurus'?' <small class="m">(diisi oleh akses Unit RW)</small>':''}</h2>${ro?'':`<button class="pr" onclick="form('${k}')">+ Tambah</button>`}</div><div class="card sc"><table><tr>${cols.map(c=>`<th>${lab(c)}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}<td class="ac">${k=='members'||k=='umem'?`<button onclick="det('${k}',${r.id})">Detail</button>`:''}${k=='rapat'&&U.role=='pengurus'?`<button onclick="hadirPdf(${r.id})">PDF Hadir</button>`:''}${s.print?`<button onclick="cetak(${r.id})">Lihat / Unduh</button>`:''}${ro?'':`<button onclick="form('${k}',${r.id})">Edit</button><button onclick="del('${k}',${r.id})">Hapus</button>`}</td></tr>`).join('')||'<tr><td colspan="9" class="m">Belum ada data</td></tr>'}</table></div>`}

function form(k,id){const s=SC[k],r=id?S[k].find(x=>x.id==id):{};let f=s.f;if(s.unit&&U.role!='unit')f=[['rw','RW / Unit','sel',s.print?['Kelurahan',...RW]:RW],...f];
const fm=$('#dlg form');fm.className='';
fm.innerHTML=`<h3>${id?'Edit':'Tambah'} ${s.t}</h3>`+f.map(([n,l,t,o])=>`<div class="${t=='area'||t=='checks'||t=='img'?'w':''}"><label>${l}</label>`+(t=='sel'?`<select name="${n}">${o.map(v=>`<option ${r[n]==v?'selected':''}>${v}</option>`).join('')}</select>`:t=='area'?`<textarea name="${n}" rows="3">${E(r[n])}</textarea>`:t=='checks'?`<div class="ck">${S.members.map(m=>`<label><input type="checkbox" name="${n}" value="${m.id}" ${(r[n]||[]).includes(m.id)?'checked':''}>${E(m.nama)} (RW ${m.rw})</label>`).join('')}</div>`:t=='img'?`<input type="file" accept="image/*" onchange="imgPick(this)"><input type="hidden" name="${n}" value="${E(r[n])}">${r[n]?`<img src="${r[n]}" style="max-width:100%;max-height:120px;display:block;margin-bottom:8px">`:''}`:t=='dl'?`<input name="${n}" list="dl_${n}" value="${E(r[n])}" required><datalist id="dl_${n}">${(typeof o=='function'?o():o).map(v=>`<option value="${E(v)}">`).join('')}</datalist>`:`<input name="${n}" type="${{opt:'url',opte:'email',opt0:'text'}[t]||t||'text'}" value="${E(r[n])}" ${/^opt/.test(t)?'':'required'}>`)+'</div>').join('')+`<div class="ac w"><button type="button" onclick="$('#dlg').close()">Batal</button><button class="pr">Simpan</button></div>`;
fm.onsubmit=e=>{e.preventDefault();const fd=new FormData(fm),o=id?r:{id:Date.now()};f.forEach(([n,,t])=>o[n]=t=='checks'?fd.getAll(n).map(Number):fd.get(n));if(s.unit&&U.role=='unit')o.rw=U.rw;if(!id)S[k].push(o);save();$('#dlg').close();go(view);if(k=='stim')cetak(o.id)};
$('#dlg').showModal()}
function del(k,id){if(!confirm('Hapus data ini?'))return;S[k]=S[k].filter(x=>x.id!=id);save();go(view)}

function card(l,v){return `<div class="card st"><div class="m">${l}</div><b>${v}</b></div>`}
const evCard=e=>`<div class="card ev">${e.foto?`<img src="${e.foto}" alt="">`:''}<div><b>${E(e.judul)}</b><div class="m">${D(e.tanggal)} · ${E(e.lokasi)}</div><p class="pre2">${E(e.ket)}</p>${e.ig?`<a href="${E(e.ig)}" target="_blank" rel="noopener noreferrer">Lihat di Instagram ↗</a>`:''}</div></div>`;
function dash(){const today=new Date().toISOString().slice(0,10),ev=[...S.events].sort((a,b)=>a.tanggal<b.tanggal?1:-1),up=ev.filter(e=>e.tanggal>=today).reverse(),past=ev.filter(e=>e.tanggal<today);let g='';
if(U.role=='pengurus')g=card('Anggota aktif',S.members.filter(m=>m.status=='Aktif').length)+card('Unit RW aktif',RW.filter(r=>S.units[r].status!='Tidak aktif').length+' / '+RW.length)+card('Anggota unit',S.umem.length)+card('Laporan stimulan',S.stim.length);
else if(U.role=='anggota')g=card('Rapat dihadiri',S.rapat.filter(r=>r.hadir.includes(U.id)).length+' / '+S.rapat.length)+card('Event mendatang',up.length);
else g=card('Anggota unit',S.umem.filter(x=>x.rw==U.rw).length)+card('Laporan stimulan',S.stim.filter(x=>x.rw==U.rw).length);
const nt=[...S.rapat].filter(r=>r.notulen).sort((a,b)=>a.tanggal<b.tanggal?1:-1).slice(0,5);
return `<div class="hd"><h2>Dashboard</h2></div><div class="grid">${g}</div><h3 class="sec">Event yang akan dijalankan</h3>${up.map(evCard).join('')||'<p class="m">Belum ada event mendatang</p>'}<h3 class="sec">Berita dan dokumentasi kegiatan</h3>${past.map(evCard).join('')||'<p class="m">Belum ada berita</p>'}${U.role=='unit'?'':`<h3 class="sec">Notulensi rapat</h3>${nt.map(r=>`<details class="card"><summary><b>${E(r.judul)}</b> · ${D(r.tanggal)}</summary><p class="pre2">${E(r.notulen)}</p></details>`).join('')||'<p class="m">Belum ada notulensi</p>'}`}`}
function vUnits(){return `<div class="hd"><h2>Unit RW Kelurahan Cijantung</h2><button class="pr" onclick="uForm()">+ Tambah Unit RW</button></div><div class="card sc"><table><tr><th>RW</th><th>Nama unit</th><th>Ketua</th><th>Status</th><th>Anggota</th><th>Laporan</th><th></th></tr>${RW.map(r=>{const u=S.units[r],on=u.status!='Tidak aktif';return `<tr><td>RW ${r}</td><td>${E(u.nama)}</td><td>${E(u.ketua)||'-'}</td><td class="${on?'ok':'no'}">${u.status}</td><td>${S.umem.filter(x=>x.rw==r).length}</td><td>${S.stim.filter(x=>x.rw==r).length}</td><td class="ac"><button onclick="uForm('${r}')">Edit</button><button onclick="togU('${r}')">${on?'Nonaktifkan':'Aktifkan'}</button></td></tr>`}).join('')}</table></div>`}
function togU(r){const u=S.units[r];u.status=u.status=='Tidak aktif'?'Aktif':'Tidak aktif';save();go(view)}
function uForm(rw){const u=rw?S.units[rw]:{nama:'',ketua:'',status:'Aktif'},fm=$('#dlg form');fm.className='one';
fm.innerHTML=`<h3>${rw?'Edit':'Tambah'} Unit RW</h3><label>Nomor RW</label><input name="no" value="${rw||''}" ${rw?'readonly':'required'} placeholder="contoh: 09"><label>Nama unit (di bawah KARANG TARUNA)</label><input name="nama" value="${E(u.nama)}" placeholder="UNIT RW 09" required><label>Ketua unit</label><input name="ketua" value="${E(u.ketua)}"><label>Status</label><select name="status"><option ${u.status!='Tidak aktif'?'selected':''}>Aktif</option><option ${u.status=='Tidak aktif'?'selected':''}>Tidak aktif</option></select><div class="ac"><button type="button" onclick="$('#dlg').close()">Batal</button><button class="pr">Simpan</button></div>`;
fm.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fm)),no=String(d.no).replace(/\D/g,'').padStart(2,'0');if(!rw&&S.units[no])return toast('RW '+no+' sudah ada');
S.units[no]=Object.assign(rw?u:{sekretariat:'Sekretariat RW '+no+', Kelurahan Cijantung, Kec. Pasar Rebo, Jakarta Timur',sekretaris:'',kota:'Jakarta'},{nama:d.nama,ketua:d.ketua,status:d.status});save();fix();$('#dlg').close();go(view)};$('#dlg').showModal()}
function vHadir(){return `<div class="hd"><h2>Kehadiran Rapat Saya</h2></div><div class="card sc"><table><tr><th>Tanggal</th><th>Agenda</th><th>Status</th></tr>${[...S.rapat].sort((a,b)=>a.tanggal<b.tanggal?1:-1).map(r=>`<tr><td>${D(r.tanggal)}</td><td>${E(r.judul)}</td><td class="${r.hadir.includes(U.id)?'ok':'no'}">${r.hadir.includes(U.id)?'Hadir':'Tidak hadir'}</td></tr>`).join('')||'<tr><td class="m">Belum ada rapat</td></tr>'}</table></div>`}
const kopOf=rw=>rw=='Kelurahan'?S.kel:S.units[rw],myKop=()=>kopOf(U.role=='unit'?U.rw:'Kelurahan');
function vSet(){const u=myKop(),i=(n,l)=>`<label>${l}</label><input name="${n}" value="${E(u[n])}">`,a=(n,l,r)=>`<label>${l}</label><textarea name="${n}" rows="${r}">${E(u[n])}</textarea>`;
return `<div class="hd"><h2>Pengaturan Kop Surat</h2></div><form class="card" onsubmit="setu(event)">${i('nama','Nama unit / pengurus (baris di bawah KARANG TARUNA)')}${a('wilayah','Baris wilayah (kecamatan, provinsi)',2)}${a('sekretariat','Keterangan sekretariat (alamat)',3)}${i('email','Email')}<button class="pr">Simpan</button></form>`}
function setu(e){e.preventDefault();Object.assign(myKop(),Object.fromEntries(new FormData(e.target)));save();toast('Kop surat disimpan')}
const kopHtml=u=>{const br=t=>E(t).split('\n').join('<br>');return `<div class="kop"><img class="l" src="${KT}" alt=""><div><div class="k1">KARANG TARUNA</div><div class="k2">${E(u.nama).toUpperCase()}</div><div class="k3">${br(u.wilayah)}</div><div class="k4">${br(u.sekretariat)}</div>${u.email?`<div class="k4">Email: ${E(u.email)}</div>`:''}</div><img class="r2" src="${DKI}" alt=""></div><hr class="dbl">`};
function show(h,fn){$('#letter').innerHTML=h;CUR={fn};$('#lw').scrollTop=0;$('#lw').style.display='block'}
function cetak(id){const x=S.stim.find(s=>s.id==id),u=kopOf(x.rw),b=String(x.bidang||'').trim();
show(kopHtml(u)+`<div class="jd">KEGIATAN PEMANFAATAN DANA STIMULAN<br>BULAN ${E(x.bulan).toUpperCase()} TAHUN ${E(x.tahun)}</div>
<div class="k5"><b><i>1.KEGIATAN</i></b></div><div class="bd">(${E((/^bidang/i.test(b)?b:'BIDANG '+b).toUpperCase())})</div>
<table class="tt"><tr><td style="width:40%"><b>Nama Kegiatan</b></td><td>${E(x.kegiatan)}</td></tr><tr><td>&nbsp;</td><td></td></tr></table>`,'Laporan-Stimulan-'+x.bulan+'-'+x.tahun+'-'+x.kegiatan)}
function hadirPdf(id){const r=S.rapat.find(x=>x.id==id),n=r.hadir.length;
const rows=S.members.map((m,i)=>{const h=r.hadir.includes(m.id);return `<tr><td>${i+1}</td><td>${E(m.nama)}</td><td>RW ${m.rw}</td><td>${E(m.jabatan)}</td><td>${h?'Hadir':'Tidak hadir'}</td><td>${h&&m.ttd?`<img src="${m.ttd}" alt="">`:''}</td></tr>`}).join('');
show(kopHtml(S.kel)+`<div class="jd">DAFTAR HADIR RAPAT</div><p><b>Agenda</b> : ${E(r.judul)}<br><b>Tanggal</b> : ${D(r.tanggal)}<br><b>Kehadiran</b> : ${n} dari ${S.members.length} anggota</p><table class="tt dh"><tr><th>No</th><th>Nama</th><th>RW</th><th>Jabatan</th><th>Kehadiran</th><th style="width:28%">Tanda tangan</th></tr>${rows}</table>${r.notulen?`<p><b>Notulensi</b></p><p class="pre2">${E(r.notulen)}</p>`:''}`,'Daftar-Hadir-'+r.tanggal+'-'+r.judul)}
async function unduh(){const el=$('#letter'),lw=$('#lw');lw.scrollTop=0;lw.scrollLeft=0;const nm=CUR.fn.replace(/[^\w-]+/g,'-').slice(0,80)+'.pdf';
try{const dl=window.claude&&await claude.use('downloads');if(!dl||!window.html2canvas||!window.jspdf)throw{code:'unavailable'};
const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff',scrollX:0,scrollY:0}),p=new window.jspdf.jsPDF('p','mm','a4'),ph=Math.floor(cv.width*297/210),n=Math.ceil(cv.height/ph);
for(let i=0;i<n;i++){const c=document.createElement('canvas');c.width=cv.width;c.height=Math.min(ph,cv.height-i*ph);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,i*ph,cv.width,c.height,0,0,c.width,c.height);if(i)p.addPage();p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,c.height*210/cv.width)}
await dl.save({filename:nm,data:p.output('arraybuffer')});toast('PDF diunduh')}
catch(e){if(e&&e.code=='declined')return;toast('Unduh langsung tidak tersedia, memakai cetak');window.print()}}
function imgPick(i){const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);i.nextElementSibling.value=c.toDataURL('image/jpeg',.7)};im.src=fr.result};fr.readAsDataURL(f)}
let PD=0;
function vProfil(){const m=S.members.find(x=>x.id==U.id);PD=0;setTimeout(padInit,0);
return `<div class="hd"><h2>Profil Saya</h2></div><div class="card"><p><b>${E(m.nama)}</b><br><span class="m">RW ${m.rw} · ${E(m.jabatan)} · ${E(m.hp)}</span></p><h3>Tanda tangan</h3><p class="m">Gambar tanda tangan dengan jari atau mouse. Tanda tangan ini otomatis dipakai pada PDF daftar hadir rapat.</p><canvas id="pad" width="360" height="150" style="border:1px dashed var(--m);border-radius:8px;background:#fff;touch-action:none;max-width:100%"></canvas><div style="margin-top:8px"><button onclick="padClr()">Ulangi</button> <button class="pr" onclick="padSave()">Simpan tanda tangan</button>${m.ttd?` <button onclick="padDel()">Hapus tersimpan</button>`:''}</div>${m.ttd?`<p class="m">Tersimpan saat ini:</p><img src="${m.ttd}" alt="" style="background:#fff;border:1px solid var(--b);border-radius:8px;max-width:100%">`:''}</div>`}
function padInit(){const c=$('#pad');if(!c)return;const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#000';let d=0;
const p=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{d=1;PD=1;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
c.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>d=0}
function padClr(){const c=$('#pad');c.getContext('2d').clearRect(0,0,c.width,c.height);PD=0}
function padSave(){if(!PD)return toast('Coretan masih kosong');S.members.find(x=>x.id==U.id).ttd=$('#pad').toDataURL('image/png');save();toast('Tanda tangan disimpan');go('profil')}
function padDel(){delete S.members.find(x=>x.id==U.id).ttd;save();go('profil')}

load();fillU();
</script></body></html>
